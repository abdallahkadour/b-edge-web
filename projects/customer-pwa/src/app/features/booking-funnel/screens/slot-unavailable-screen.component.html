<div class="relative flex flex-col min-h-full bg-gray-50 text-ink items-center justify-center px-6 pb-[140px]">
  <div class="flex flex-col items-center text-center max-w-[300px] w-full">
    <div class="w-[72px] h-[72px] rounded-full border-2 border-ink text-ink flex items-center justify-center mb-6">
      <lucide-icon name="x" [size]="32" [strokeWidth]="2.5" />
    </div>

    <h1 class="text-[22px] font-bold leading-[28px] tracking-[-0.02em] text-ink">
      This slot was just taken
    </h1>
    <p class="text-[15px] text-gray-500 leading-[22px] mt-3">
      Someone else booked this time while you were filling in your details. Please pick another slot.
    </p>
  </div>

  <div class="fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-gray-200 z-50 flex justify-center">
    <div class="w-full max-w-[390px] px-2 flex flex-col items-center gap-3">
      <span class="text-[13px] text-gray-400 text-center">
        Your details have been saved — you won't need to re-enter them.
      </span>
      <button
        (click)="chooseAnotherTime.emit()"
        class="w-full h-[52px] rounded bg-ink text-white text-[15px] font-medium leading-[20px] flex items-center justify-center hover:opacity-90 active:opacity-[85%] transition-all cursor-pointer"
      >
        Choose another time
      </button>
      <button
        (click)="backToProfile.emit()"
        class="w-full h-[52px] rounded border border-gray-200 bg-white text-ink text-[15px] font-medium leading-[20px] flex items-center justify-center hover:bg-gray-50 active:bg-gray-100 transition-all cursor-pointer"
      >
        Back to profile
      </button>
    </div>
  </div>
</div>
