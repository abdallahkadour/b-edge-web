<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>B-Edge</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1A1A1A" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <script>
    /*
     * Applies the saved theme BEFORE first paint.
     *
     * ThemeStore does the same thing, but it runs in an Angular constructor -
     * i.e. after the bundle has parsed and bootstrapped. On a mid-range phone
     * over Lebanese mobile data that is comfortably long enough to show a
     * full-brightness white page to someone who chose dark, which is both
     * jarring and, at night, genuinely unpleasant.
     *
     * Deliberately absent: any handling of 'system'. That case needs NO
     * attribute - the prefers-color-scheme query in the stylesheet has
     * already resolved it by the time this runs, with no JavaScript at all.
     * Stamping something here would break OS following.
     *
     * Kept in sync with ThemeStore by hand. Both read the same key and write
     * the same attribute; if that ever diverges the symptom is a flash of the
     * wrong theme, not a broken app.
     */
    try {
      var t = localStorage.getItem('bedge_theme');
      if (t === 'dark' || t === 'light') {
        document.documentElement.setAttribute('data-theme', t);
      }
    } catch (e) {
      /* private mode: fall through to prefers-color-scheme */
    }
  </script>

    <style>
      /*
       * First-paint splash.
       *
       * WHY THIS EXISTS. Measured on 2026-09-19 under Fast 3G (1.6 Mbps,
       * 150 ms RTT) against the production bundle: /discover showed a
       * COMPLETELY BLANK WHITE PAGE for 2.5-3.0 s. Not a slow API - the
       * same 2.5-3.0 s with the API stubbed to answer instantly. It is
       * bundle download plus bootstrap, and `<app-root>
      <div class="bedge-splash" role="status" aria-label="Loading B-Edge"><span>B-Edge</span></div>
    </app-root>` was
       * empty, so the browser had nothing to paint until Angular booted.
       *
       * No Angular skeleton component can fix that, because the framework
       * that would render it is the thing still downloading. The only code
       * that can paint in that window is code already in the HTML.
       *
       * Angular clears the host element's children when the root component
       * renders, so this disappears on bootstrap with nothing to clean up.
       *
       * Costs ~0.6 KB inline, no request, no bundle impact.
       *
       * Grounds are copied from _theme.scss (--c-gray-50 / --c-ink) rather
       * than read from it: the stylesheet is a separate file, and the whole
       * point is to paint before anything else has arrived. If the palette
       * moves, the symptom is a one-frame colour mismatch on boot.
       */
      .bedge-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgb(250 250 250);
        color: rgb(10 10 10);
      }
      .bedge-splash span {
        font: 600 0.8125rem/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        opacity: 0.55;
        animation: bedge-splash-pulse 1.4s ease-in-out infinite;
      }
      @keyframes bedge-splash-pulse {
        0%, 100% { opacity: 0.28; }
        50%      { opacity: 0.68; }
      }
      /* Unstamped document following a dark OS - see the theme script above. */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .bedge-splash {
          background: rgb(18 18 20);
          color: rgb(250 250 250);
        }
      }
      /* Explicit choice wins in both directions. */
      :root[data-theme="dark"] .bedge-splash {
        background: rgb(18 18 20);
        color: rgb(250 250 250);
      }
      @media (prefers-reduced-motion: reduce) {
        .bedge-splash span { animation: none; opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="bedge-splash" role="status" aria-label="Loading B-Edge"><span>B-Edge</span></div>
    </app-root>
  </body>
</html>
